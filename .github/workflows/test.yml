name: smoke tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # A commit without the test setup (e.g. one that only adds this workflow)
      # has nothing to run, so the steps below are skipped rather than failing.
      - uses: actions/setup-node@v4
        if: hashFiles('package.json') != ''
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
        if: hashFiles('package.json') != ''
      - run: npx playwright install --with-deps chromium
        if: hashFiles('package.json') != ''
      - run: npm test
        if: hashFiles('tests/smoke.mjs') != ''
